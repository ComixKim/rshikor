/* ─── TOAST SYSTEM ───────────────────────────────────────────── */
const _toastListeners = [];
window.TOAST = {
  show: (msg, type = 'success') => {
    const id = Date.now() + Math.random();
    _toastListeners.forEach(fn => fn({ id, msg, type }));
  },
};
function ToastContainer() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    const handler = toast => {
      setToasts(p => [...p, toast]);
      setTimeout(() => setToasts(p => p.filter(t => t.id !== toast.id)), 2800);
    };
    _toastListeners.push(handler);
    return () => { const i = _toastListeners.indexOf(handler); if (i >= 0) _toastListeners.splice(i, 1); };
  }, []);
  if (!toasts.length) return null;
  return (
    <div style={{ position:'fixed', bottom:28, left:'50%', transform:'translateX(-50%)', zIndex:990, display:'flex', flexDirection:'column', gap:8, alignItems:'center', pointerEvents:'none' }}>
      <style>{`@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}`}</style>
      {toasts.map(t => (
        <div key={t.id} style={{
          background: t.type === 'error' ? RE : '#0F172A', color: WH,
          borderRadius:10, padding:'10px 20px', fontSize:13, fontWeight:500,
          boxShadow:'0 6px 24px rgba(0,0,0,0.22)', animation:'toastIn .2s ease',
          display:'flex', alignItems:'center', gap:8, whiteSpace:'nowrap',
        }}>
          <span style={{ fontSize:15 }}>{t.type === 'error' ? '✕' : '✓'}</span>
          {t.msg}
        </div>
      ))}
    </div>
  );
}

function LoginScreen({ onLogin }) {

    if (login === CREDS[selRole].login && pass === '1234') {

    <div style={{

      background:`linear-gradient(150deg, ${N} 0%, #162448 100%)`,

      <div style={{ position:'absolute', bottom:-100, left:-100, width:360, height:360, borderRadius:'50%', background:'rgba(0,85,164,0.07)', pointerEvents:'none' }} />

          <path d="M8 1.5C5.5 1.5 3.5 3.5 3.5 6v3.5L2 12h12l-1.5-2.5V6C12.5 3.5 10.5 1.5 8 1.5z" strokeLinejoin="round"/>

          <div style={{
            position:'absolute', top:44, right:0, width:348, background:WH,
            borderRadius:14, boxShadow:'0 8px 40px rgba(0,0,0,0.16)',

          }}>
            <div style={{ padding:'12px 16px', borderBottom:`1px solid ${BR}`, display:'flex', justifyContent:'space-between', alignItems:'center' }}>

                  <span style={{ marginLeft:7, fontSize:11, padding:'1px 7px', borderRadius:10, background:REB, color:RE, fontWeight:600 }}>{unread}</span>

                <button onClick={markAll} style={{ fontSize:11, color:B, background:'none', border:'none', cursor:'pointer', fontFamily:'inherit', fontWeight:500 }}>

              )}

              <div key={n.id} onClick={() => { markOne(n.id); if (n.page && onNav) { onNav(n.page); setOpen(false); } }}

                  display:'flex', gap:11, padding:'11px 16px', cursor:'pointer',
                  background: n.read ? 'transparent' : '#F0F6FF',
                  borderBottom:`1px solid #F1F5F9`, transition:'background .1s',
                }}
                onMouseEnter={e => e.currentTarget.style.background='#F8FAFC'}
                onMouseLeave={e => e.currentTarget.style.background=n.read?'transparent':'#F0F6FF'}
              >
                <span style={{ fontSize:15, lineHeight:1.5, flexShrink:0 }}>{TYPE_ICON[n.type] || '📌'}</span>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:12.5, color:n.read?T1:T0, fontWeight:n.read?400:500, lineHeight:1.45, textWrap:'pretty' }}>{n.text}</div>

    <aside style={{
      width: collapsed ? 64 : 240, minWidth: collapsed ? 64 : 240,

          </div>
        )}
      </div>

      {/* Nav */}
      <nav style={{ padding:'6px 0', flexShrink:0 }}>
        {navItems.map(({ key, Icon }) => {
          const active = activePage === key;

                fontFamily:'inherit', fontSize:13, fontWeight: active ? 600 : 400,

              }}
              onMouseEnter={e => { if (!active) { e.currentTarget.style.background='rgba(255,255,255,0.05)'; e.currentTarget.style.color='#fff'; }}}
              onMouseLeave={e => { if (!active) { e.currentTarget.style.background='transparent'; e.currentTarget.style.color='rgba(255,255,255,0.5)'; }}}

              <span style={{ flexShrink:0, display:'flex', opacity: active ? 1 : 0.7 }}><Icon /></span>

      {/* Divider */}
      <div style={{ height:1, background:'rgba(255,255,255,0.07)', margin:'2px 0', flexShrink:0 }} />

      {/* Sports */}
      <div style={{ flex:1, overflowY:'auto', padding:'6px 0' }}>
        {!collapsed && (
          <div style={{ padding:'7px 18px 4px', fontSize:10, fontWeight:600,

          const disabled = role === 'trainer' && i !== TRAINER_SPORT;
          const active   = activeSport === i;
          const isMine   = role === 'trainer' && i === TRAINER_SPORT;
          return (
            <button key={i} onClick={() => !disabled && onSport(active ? null : i)}

              style={{
                display:'flex', alignItems:'center', gap:8, width:'100%',

/* ─── KPI CARD ───────────────────────────────────────────────── */
function KPICard({ label, value, sub, accent, Icon, onClick }) {
  const [hov, setHov] = useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={() => onClick && setHov(true)}
      onMouseLeave={() => onClick && setHov(false)}
      style={{
        background:WH, borderRadius:12, padding:'20px 22px',
        border:`1px solid ${hov ? accent+'55' : BR}`, borderTop:`3px solid ${accent}`,
        display:'flex', flexDirection:'column', gap:6,
        cursor: onClick ? 'pointer' : 'default',
        transition:'transform .12s, box-shadow .12s, border-color .12s',
        transform: hov ? 'translateY(-2px)' : 'none',
        boxShadow: hov ? `0 8px 24px ${accent}20` : 'none',
      }}
    >
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
        <div style={{ fontSize:11, fontWeight:600, color:T1, textTransform:'uppercase', letterSpacing:0.6 }}>
          {label}
        </div>
        <span style={{ color:accent, opacity:0.65 }}><Icon /></span>
      </div>
      <div style={{ fontSize:40, fontWeight:800, color:T0, lineHeight:1, letterSpacing:-1 }}>{value}</div>
      {sub && <div style={{ fontSize:12, color:T2 }}>{sub}</div>}
    </div>
  );
}

/* ─── SPORTS TABLE ───────────────────────────────────────────── */
function SportsTable({ t }) {
  const withNames = SPORTS_DATA.map((d, i) => ({ s:d.s, name:t.sports[i] }));
  const sorted = [...withNames].sort((a, b) => b.s - a.s);
  const max = sorted[0]?.s || 1;
  const total = SPORTS_DATA.reduce((acc, d) => acc + d.s, 0);
  return (
    <div style={{ background:WH, borderRadius:12, border:`1px solid ${BR}`, overflow:'hidden' }}>
      <div style={{ padding:'14px 20px', borderBottom:`1px solid ${BR}`, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <div style={{ fontWeight:600, fontSize:14, color:T0 }}>{t.distribution}</div>
        <div style={{ fontSize:12, color:T2 }}>{t.total}: {total}</div>
      </div>
      <div style={{ maxHeight:448, overflowY:'auto' }}>
        {sorted.map((item, i) => (
          <div key={i}
            style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 20px', transition:'background .1s' }}
            onMouseEnter={e => e.currentTarget.style.background='#F8FAFC'}
            onMouseLeave={e => e.currentTarget.style.background='transparent'}
          >
            <div style={{
              width:22, height:22, borderRadius:5, flexShrink:0,
              background: i < 3 ? G : '#F1F5F9',
              color: i < 3 ? N : T2,
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:10, fontWeight:700,
            }}>{i + 1}</div>
            <div style={{ width:148, fontSize:13, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', flexShrink:0, color:T0 }}>
              {item.name}
            </div>
            <div style={{ flex:1, height:5, background:'#EEF2F7', borderRadius:3, overflow:'hidden' }}>
              <div style={{
                height:'100%', borderRadius:3, transition:'width 0.8s cubic-bezier(.4,0,.2,1)',
                width:`${(item.s / max) * 100}%`,
                background: i < 3 ? B : 'rgba(0,85,164,0.3)',
              }} />
            </div>
            <div style={{ width:28, textAlign:'right', fontSize:13, fontWeight:600, color:T0, flexShrink:0 }}>{item.s}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

        <MedicalAlerts t={t} alerts={myMed} />
      </div>
      <AchievementsPanel t={t} items={myAch} summary={{ gold:2, silver:1, bronze:2 }} />
    </div>
  );
}

/* ─── DIRECTOR DASHBOARD ─────────────────────────────────────── */
function DirectorDashboard({ t, onNav }) {
  const total = SPORTS_DATA.reduce((acc, d) => acc + d.s, 0);
  const PERF = [
    { label:'Медальный КПД',   value:'13.2%', sub:'медалей на 100 учеников', color:GO  },
    { label:'Травматизм',      value:'2.3%',  sub:'активных медслучаев',     color:RE  },
    { label:'Норматив МС/КМС', value:'18.4%', sub:'выполнивших норматив',    color:DIR },
  ];
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
      {/* Banner */}
      <div style={{
        background:`linear-gradient(135deg, ${DIR} 0%, #0F766E 100%)`,
        borderRadius:14, padding:'20px 28px',
        display:'flex', alignItems:'center', gap:20,
        position:'relative', overflow:'hidden',
      }}>
        <div style={{ position:'absolute', right:-50, top:-50, width:200, height:200, borderRadius:'50%', background:'rgba(255,255,255,0.05)', pointerEvents:'none' }} />
        <div style={{ flex:1, position:'relative' }}>
          <div style={{ color:'rgba(255,255,255,0.55)', fontSize:11, fontWeight:600, letterSpacing:0.8, textTransform:'uppercase', marginBottom:5 }}>Обзор школы</div>
          <div style={{ color:WH, fontSize:19, fontWeight:700, letterSpacing:-0.3 }}>РСШИКОР им. К. Ахметова</div>
          <div style={{ color:'rgba(255,255,255,0.48)', fontSize:12, marginTop:3 }}>14 видов спорта · г. Алматы</div>
        </div>
        <div style={{ textAlign:'right', position:'relative' }}>
          <div style={{ color:'rgba(255,255,255,0.48)', fontSize:11 }}>Учебный год</div>
          <div style={{ color:WH, fontSize:28, fontWeight:800, letterSpacing:-1 }}>2025–2026</div>
        </div>
      </div>

      {/* KPI */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px,1fr))', gap:16 }}>
        <KPICard label={t.kpi.students}     value={total} sub={t.subMay}                accent={DIR}     Icon={Ic.Users}  />
        <KPICard label={t.kpi.trainers}     value="14"    sub={t.onePerSport}             accent='#7C3AED' Icon={Ic.Gear}   />
        <KPICard label={t.kpi.medical}      value="8"     sub="3 🔴 · 5 🟡"             accent={RE}      Icon={Ic.Cross}  />
        <KPICard label={t.kpi.achievements} value="47"    sub="🥇 12 · 🥈 18 · 🥉 17"   accent={GO}      Icon={Ic.Trophy} />
      </div>

      {/* Performance */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16 }}>
        {PERF.map(item => (
          <div key={item.label} style={{ background:WH, borderRadius:12, padding:'18px 22px', border:`1px solid ${BR}`, borderTop:`3px solid ${item.color}` }}>
            <div style={{ fontSize:11, fontWeight:600, color:T1, textTransform:'uppercase', letterSpacing:0.5, marginBottom:10 }}>{item.label}</div>
            <div style={{ fontSize:36, fontWeight:800, color:T0, lineHeight:1, letterSpacing:-1 }}>{item.value}</div>
            <div style={{ fontSize:12, color:T2, marginTop:6 }}>{item.sub}</div>
          </div>
        ))}
      </div>

      {/* Content */}
      <div style={{ display:'grid', gridTemplateColumns:'3fr 2fr', gap:20 }}>
        <SportsTable t={t} />
        <MedicalAlerts t={t} alerts={MEDICAL} onNav={onNav} />
      </div>
      <AchievementsPanel t={t} items={ACHIEVEMENTS.slice(0,6)} summary={{ gold:12, silver:18, bronze:17 }} onNav={onNav} />
    </div>
  );
}

/* ─── PLACEHOLDER PAGE ───────────────────────────────────────── */
function PlaceholderPage({ t }) {
  return (
    <div style={{
      background:WH, border:`1px solid ${BR}`, borderRadius:12,
      padding:'72px 40px', textAlign:'center',
    }}>
      <div style={{ fontSize:44, marginBottom:14 }}>🚧</div>
      <div style={{ fontSize:16, fontWeight:600, color:T0, marginBottom:6 }}>{t.inDev}</div>
      <div style={{ color:T2, fontSize:13 }}>{t.inDevSub}</div>
    </div>
  );
}

/* ─── APP ────────────────────────────────────────────────────── */
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activePage, setActivePage]   = useState('dashboard');
  const [activeSport, setActiveSport] = useState(null);
  const [isLoggedIn, setIsLoggedIn]   = useState(false);

  const handleLogin  = useCallback((role) => { setTweak('role', role); setIsLoggedIn(true); }, []);
  const handleLogout = useCallback(() => { setIsLoggedIn(false); setActivePage('dashboard'); setActiveSport(null); }, []);
  const handleStudentNav = useCallback((stuId) => { setActivePage('students'); setStudentTarget(stuId); }, []);
  const [studentTarget, setStudentTarget] = useState(null);

  const t = LANG[tweaks.lang];
  const pageLabel = t.navLabels[t.navKeys.indexOf(activePage)] || activePage;

  if (!isLoggedIn) return <LoginScreen onLogin={handleLogin} />;

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden', background:BG, width:'100%' }}>
      <Sidebar
        t={t} role={tweaks.role}
        activePage={activePage} onNav={setActivePage}
        activeSport={activeSport} onSport={setActiveSport}
        collapsed={tweaks.collapsed}
      />

      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', minWidth:0 }}>
        <Header
          t={t} lang={tweaks.lang} onLang={l => setTweak('lang', l)}
          role={tweaks.role}
          onToggle={() => setTweak('collapsed', !tweaks.collapsed)}
          onLogout={handleLogout}
          onNav={setActivePage}
        />
        <main style={{ flex:1, overflowY:'auto', padding:'22px 26px' }}
              data-screen-label={pageLabel}>
          {/* Page title */}
          <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:22, flexWrap:'wrap' }}>
            <h1 style={{ fontSize:22, fontWeight:700, color:T0, letterSpacing:-0.3 }}>{pageLabel}</h1>
            <span style={{ fontSize:13, color:T3 }}>{t.today}</span>
            {activeSport !== null && ['students','medical','achievements'].includes(activePage) && (
              <button onClick={() => setActiveSport(null)} style={{
                display:'flex', alignItems:'center', gap:5, marginLeft:4,
                padding:'3px 10px 3px 12px', border:'1px solid #93C5FD', borderRadius:20,
                background:'#EFF6FF', color:'#1D4ED8', fontSize:12, fontWeight:500,
                fontFamily:'inherit', cursor:'pointer', transition:'all .12s',
              }}
              onMouseEnter={e => e.currentTarget.style.background='#DBEAFE'}
              onMouseLeave={e => e.currentTarget.style.background='#EFF6FF'}
              >
                {t.sports[activeSport]}
                <span style={{ fontSize:10, marginLeft:2, opacity:0.7 }}>✕</span>
              </button>
            )}
          </div>

          {activePage === 'dashboard'
            ? (tweaks.role === 'trainer'
                ? <TrainerDashboard t={t} onNav={setActivePage} />
                : tweaks.role === 'director'
                ? <DirectorDashboard t={t} onNav={setActivePage} />
                : <AdminDashboard t={t} onNav={setActivePage} />)
            : activePage === 'students'
            ? <StudentPage  t={t} role={tweaks.role} lang={tweaks.lang} activeSport={activeSport} onClearSport={() => setActiveSport(null)} openStudentId={studentTarget} onClearTarget={() => setStudentTarget(null)} />
            : activePage === 'medical'
            ? <MedicalPage      t={t} role={tweaks.role} lang={tweaks.lang} activeSport={activeSport} onClearSport={() => setActiveSport(null)} onStudentClick={handleStudentNav} />
            : activePage === 'achievements'
            ? <AchievementsPage t={t} role={tweaks.role} lang={tweaks.lang} activeSport={activeSport} onClearSport={() => setActiveSport(null)} onStudentClick={handleStudentNav} />
            : activePage === 'schedule'
            ? <SchedulePage     t={t} role={tweaks.role} lang={tweaks.lang} />
            : activePage === 'users'
            ? <UsersPage        t={t} role={tweaks.role} lang={tweaks.lang} />
            : activePage === 'reports'
            ? <ReportsPage      t={t} role={tweaks.role} lang={tweaks.lang} />
            : <PlaceholderPage t={t} />
          }
        </main>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Роль / Role" />
        <TweakRadio
          label="Роль"
          value={tweaks.role}
          options={[
            { value:'admin',    label:'Admin'    },
            { value:'director', label:'Director' },
            { value:'trainer',  label:'Trainer'  },
          ]}
          onChange={v => setTweak('role', v)}
        />
        <TweakSection label="Интерфейс" />
        <TweakRadio
          label="Язык"
          value={tweaks.lang}
          options={[{ value:'ru', label:'RU' }, { value:'kz', label:'KZ' }]}
          onChange={v => setTweak('lang', v)}
        />
        <TweakToggle
          label="Compact sidebar"
          value={tweaks.collapsed}
          onChange={v => setTweak('collapsed', v)}
        />
      </TweaksPanel>
      <ToastContainer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
